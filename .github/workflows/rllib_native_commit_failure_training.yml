name: RLlib native Learner partial-commit training counterexample
on:
  push:
    branches:
      - research/rllib-state-commit-failstop-20261024
  pull_request:
    branches:
      - review/rllib-three-component-causal-state-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-fault-training:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install native Ray 2.59 and torch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ray[rllib]==2.59.0" pytest
      - name: Check test and actual Learner source syntax
        run: |
          python -m py_compile ci/rllib_native_commit_failure_training.py
          python -m py_compile python/ray/rllib/core/learner/learner.py
      - name: Restore Ray native CartPole offline fixture omitted from wheel
        run: |
          python - <<'PY'
          import pathlib, shutil, ray
          source = pathlib.Path("python/ray/rllib/offline/tests/data/cartpole/large.json")
          target = pathlib.Path(ray.__file__).resolve().parent / "rllib/offline/tests/data/cartpole/large.json"
          assert source.is_file() and source.stat().st_size > 1000
          target.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, target)
          print("Installed native offline fixture",target,"bytes",target.stat().st_size)
          PY
      - name: Real CartPole Learner update after injected selector failure
        run: |
          cp python/ray/rllib/core/learner/learner.py /tmp/review_learner.py
          cp ci/rllib_native_commit_failure_training.py /tmp/
          cd /tmp
          python rllib_native_commit_failure_training.py /tmp/review_learner.py
