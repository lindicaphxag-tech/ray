name: RLlib EnvRunner stale-version red-green proof (CPU)
on:
  pull_request:
    paths:
      - "ci/rllib_envrunner_monotonic_contract.py"
      - ".github/workflows/rllib_envrunner_monotonic_cpu.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  version-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: python -m pip install ruff==0.17.1
      - name: Compile all upstream-candidate sources
        run: |
          python -m py_compile python/ray/rllib/env/multi_agent_env_runner.py
          python -m py_compile python/ray/rllib/env/tests/test_multi_agent_env_runner.py
          python -m py_compile ci/rllib_envrunner_monotonic_contract.py
      - name: Focused lint without rewriting unchanged upstream legacy style
        run: |
          ruff check --isolated --select E4,E7,E9,F python/ray/rllib/env/multi_agent_env_runner.py python/ray/rllib/env/tests/test_multi_agent_env_runner.py
      - name: Run actual proposed EnvRunner stale-version invariant
        run: python ci/rllib_envrunner_monotonic_contract.py
      - name: Fetch unchanged official master method for negative control
        run: |
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/ray-project/ray/a82c56ee769fc02b1e4442d2ade57c9713263443/python/ray/rllib/env/multi_agent_env_runner.py -o /tmp/original_multi_agent_env_runner.py
      - name: Reproduce old version rollback using same fixture
        run: python ci/rllib_envrunner_monotonic_contract.py /tmp/original_multi_agent_env_runner.py --baseline
