name: AutoRLBench shared-image CPU feasibility probe
on:
  push:
    branches:
      - research/autorlbench-image-probe-20261121
    paths:
      - .github/workflows/autorlbench-shared-image-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    container:
      image: verlai/verl:vllm017.latest@sha256:4c43bbf17e90284b1102008399240b25406e8d34fea178d86272231b333b7cb6
      options: --shm-size=4g
    timeout-minutes: 25
    steps:
      - name: Inspect the pinned AutoRLBench image
        shell: bash
        run: |
          set -euo pipefail
          python --version
          python - <<'PY'
          import importlib.util
          import platform
          import sys
          print("platform:", platform.platform())
          print("python:", sys.version)
          for name in ("torch", "ray", "gymnasium", "numpy", "pyarrow"):
              spec = importlib.util.find_spec(name)
              print(f"{name}_available:", spec is not None)
              if spec is not None:
                  module = __import__(name)
                  print(f"{name}_version:", getattr(module, "__version__", "unknown"))
          try:
              import torch
              print("torch_cpu_tensor:", (torch.ones(2) + 1).tolist())
          except Exception as exc:
              print("torch_probe_error:", repr(exc))
              raise
          try:
              import ray
              import ray.rllib
              print("ray_rllib_import:", "ok", ray.__version__)
          except Exception as exc:
              print("ray_rllib_import_error:", repr(exc))
          PY
