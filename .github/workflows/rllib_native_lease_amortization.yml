name: RLlib native lease cost — no lease vs per-step vs amortized
on:
  push:
    branches:
      - research/rllib-state-commit-failstop-20261024
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-lease-bench:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAY_AUTH_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Ray 2.59 and CPU PyTorch
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ray[rllib]==2.59.0"
      - name: Restore offline CartPole fixture to native installed wheel
        run: |
          python - <<'PY'
          import pathlib,shutil,ray
          source=pathlib.Path('python/ray/rllib/offline/tests/data/cartpole/large.json')
          target=pathlib.Path(ray.__file__).resolve().parent/'rllib/offline/tests/data/cartpole/large.json'
          assert source.is_file() and source.stat().st_size>1000
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(source,target)
          PY
      - name: Source syntax
        run: |
          python -m py_compile ci/rllib_two_actor_epoch_fenced_recovery.py ci/rllib_native_lease_amortization_benchmark.py
      - name: Native performance three-arm A/B and gradient update validity
        run: |
          cp python/ray/rllib/core/learner/learner.py /tmp/review_learner.py
          cp ci/rllib_two_actor_epoch_fenced_recovery.py /tmp/
          cp ci/rllib_native_lease_amortization_benchmark.py /tmp/
          cd /tmp
          timeout 480s python -u rllib_native_lease_amortization_benchmark.py /tmp/review_learner.py
