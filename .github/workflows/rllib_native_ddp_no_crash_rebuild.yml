name: RLlib warm Adam no-crash fresh DDP group counterfactual
on:
  push:
    branches:
      - research/rllib-state-commit-failstop-20261024
  pull_request:
    branches:
      - review/rllib-three-component-causal-state-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-no-crash-control:
    runs-on: ubuntu-latest
    timeout-minutes: 24
    env:
      RAY_AUTH_MODE: disabled
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install native Ray and PyTorch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ray[rllib]==2.59.0" pytest
      - name: Restore the unchanged Ray CartPole offline fixture
        run: |
          python - <<'PY'
          import pathlib,shutil,ray
          src=pathlib.Path("python/ray/rllib/offline/tests/data/cartpole/large.json")
          target=pathlib.Path(ray.__file__).resolve().parent/"rllib/offline/tests/data/cartpole/large.json"
          assert src.is_file() and src.stat().st_size>1000
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(src,target)
          PY
      - name: Native two-Learner healthy rebuild, warm optimizer and identical batch
        run: |
          python -m py_compile ci/rllib_native_ddp_no_crash_rebuild_control.py
          cp ci/rllib_native_two_learner_ddp_crash_health.py /tmp/
          cp ci/rllib_native_ddp_no_crash_rebuild_control.py /tmp/
          cd /tmp
          timeout 660s python -u rllib_native_ddp_no_crash_rebuild_control.py
