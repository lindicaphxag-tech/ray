name: RLlib paired Learner state provenance (CPU)
on:
  push:
    branches:
      - research/rllib-stale-optimizer-transaction-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  transactional-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU-only PyTorch for real optimizer-state regression
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - name: Execute real Learner set_state with stale paired checkpoint
        run: |
          python -m py_compile python/ray/rllib/core/learner/learner.py
          python -m py_compile ci/rllib_real_adam_partial_restore.py
          python ci/rllib_stale_optimizer_transaction_contract.py
          python ci/rllib_real_adam_partial_restore.py
          python ci/rllib_same_version_distinct_adam_history.py
          python ci/rllib_optimizer_only_false_weight_publication.py
      - name: Extract pinned unmodified RLlib PR source
        run: |
          git fetch --no-tags --depth=1 https://github.com/lindicaphxag-tech/ray.git c8ce9ca7c0ba7b2a15e002b139ff38b99895fbb8
          git show FETCH_HEAD:python/ray/rllib/core/learner/learner.py > /tmp/rllib_learner_unmodified.py
      - name: Verify baseline flaw against same source-driven fixtures
        run: |
          python ci/rllib_stale_optimizer_transaction_contract.py /tmp/rllib_learner_unmodified.py --baseline
          python ci/rllib_real_adam_partial_restore.py /tmp/rllib_learner_unmodified.py --baseline
          python ci/rllib_same_version_distinct_adam_history.py /tmp/rllib_learner_unmodified.py --baseline
          python ci/rllib_optimizer_only_false_weight_publication.py /tmp/rllib_learner_unmodified.py --baseline
      - name: Reproduce equal-version and optimizer-only flaws on pinned official master
        run: |
          git fetch --no-tags --depth=1 https://github.com/ray-project/ray.git fbd093c05644bc3ba1429eef1188ec85ea563158
          git show FETCH_HEAD:python/ray/rllib/core/learner/learner.py > /tmp/rllib_learner_official_master.py
          python ci/rllib_same_version_distinct_adam_history.py /tmp/rllib_learner_official_master.py --baseline
          python ci/rllib_optimizer_only_false_weight_publication.py /tmp/rllib_learner_official_master.py --baseline
      - name: Exhaustively check short asynchronous packet orderings against production code
        run: |
          python ci/rllib_versioned_state_bounded_model_check.py python/ray/rllib/core/learner/learner.py
          python ci/rllib_versioned_state_bounded_model_check.py /tmp/rllib_learner_unmodified.py --baseline
          python ci/rllib_versioned_state_bounded_model_check.py /tmp/rllib_learner_official_master.py --baseline
