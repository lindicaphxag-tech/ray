name: Ray 67329 native wheel red-green regression
on:
  push:
    branches:
      - ci/67329-native-ray259-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install published Ray RLlib native runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ray[rllib]==2.59.0" pytest
          python -m pip show ray
      - name: Overlay the exact two production/test files from upstream Ray PR 67329
        run: |
          python - <<'PY'
          import pathlib, shutil, ray
          root = pathlib.Path.cwd()
          wheel = pathlib.Path(ray.__file__).resolve().parent
          for tail in ["env/multi_agent_env_runner.py", "env/tests/test_multi_agent_env_runner.py"]:
              source = root / "python" / "ray" / "rllib" / tail
              target = wheel / "rllib" / tail
              assert source.is_file(), source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              print("overlay", source, "->", target, flush=True)
          print("Ray", ray.__version__, "native extension", ray._raylet.__file__, flush=True)
          PY
      - name: Native patched regression must pass
        run: |
          python -m pytest -q -s --disable-warnings ${{ env.RAY_TEST_PATH }} -k test_set_state_stale_version_preserves_newer_weights_sequence
        env:
          RAY_TEST_PATH: python/ray/rllib/env/tests/test_multi_agent_env_runner.py
      - name: Reproduce exact original-version failure in same wheel
        run: |
          python - <<'PY'
          import pathlib, ray
          wheel = pathlib.Path(ray.__file__).resolve().parent
          path = wheel / "rllib/env/multi_agent_env_runner.py"
          source = path.read_text()
          fixed = "if weights_seq_no > self._weights_seq_no:"
          assert source.count(fixed) >= 1, "No verified patched predicate"
          marker = "            # Never publish an older version for weights that were rejected.\n            if weights_seq_no > self._weights_seq_no:"
          assert source.count(marker) == 1, "Unexpected source changed"
          original = "            # Update weights_seq_no, if the new one is > 0.\n            if weights_seq_no > 0:"
          path.write_text(source.replace(marker, original))
          print("Restored the old two-line defect, leaving wheel otherwise unchanged")
          PY
          python - <<'PY'
          import subprocess, sys
          argv = [sys.executable, "-m", "pytest", "-q", "-s",
                  "python/ray/rllib/env/tests/test_multi_agent_env_runner.py",
                  "-k", "test_set_state_stale_version_preserves_newer_weights_sequence"]
          result = subprocess.run(argv, capture_output=True, text=True, timeout=120)
          print(result.stdout[-5000:], result.stderr[-1200:], flush=True)
          assert result.returncode != 0, "Original implementation incorrectly passed"
          assert "self.assertEqual(runner._weights_seq_no, 8)" in result.stdout, "Did not reproduce target-version failure"
          print("EXPECTED RED: unmodified version rollback violates the native regression")
          PY
