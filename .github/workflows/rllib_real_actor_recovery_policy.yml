name: RLlib real Actor dynamic policy restore (CPU)
on:
  pull_request:
    paths:
      - "ci/rllib_real_actor_recovery_policy_contract.py"
      - ".github/workflows/rllib_real_actor_recovery_policy.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actor-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiled Ray actor runtime
        run: python -m pip install "ray[rllib]==2.59.0"
      - name: Compile exact source and harness
        run: |
          python -m py_compile python/ray/rllib/algorithms/algorithm.py
          python -m py_compile python/ray/rllib/env/multi_agent_env_runner.py
          python -m py_compile ci/rllib_real_actor_recovery_policy_contract.py
      - name: Actual actor recovery with candidate source
        run: python ci/rllib_real_actor_recovery_policy_contract.py
      - name: Download unchanged official source at same commit
        run: |
          curl -fsSL https://raw.githubusercontent.com/ray-project/ray/7795d644673b4a4ed4d407fd9e7b0ca981e9606b/python/ray/rllib/algorithms/algorithm.py -o /tmp/orig_algorithm.py
          curl -fsSL https://raw.githubusercontent.com/ray-project/ray/7795d644673b4a4ed4d407fd9e7b0ca981e9606b/python/ray/rllib/env/multi_agent_env_runner.py -o /tmp/orig_runner.py
      - name: Actual actor restore with pinned official negative control
        run: python ci/rllib_real_actor_recovery_policy_contract.py /tmp/orig_algorithm.py /tmp/orig_runner.py --baseline
