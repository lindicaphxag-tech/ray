name: Validate PBT restore 66689

on:
  push:
    branches:
      - validation/pbt-restore-66689
  workflow_dispatch:

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install nightly Ray and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ray[rllib] @ https://s3-us-west-2.amazonaws.com/ray-wheels/latest/ray-3.0.0.dev0-cp311-cp311-manylinux2014_x86_64.whl"
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Overlay only RLlib sources
        run: |
          RAY_SITE="$(python - <<'PY'
import pathlib
import ray
print(pathlib.Path(ray.__file__).resolve().parent)
PY
)"
          rm -rf "$RAY_SITE/rllib"
          ln -s "$GITHUB_WORKSPACE/python/ray/rllib" "$RAY_SITE/rllib"
      - name: Run focused PPO restore regression
        env:
          RAY_AUTH_MODE: disabled
        run: |
          cp python/ray/rllib/algorithms/ppo/tests/test_ppo.py /tmp/test_pbt_restore_66689.py
          cd /tmp
          python -m pytest test_pbt_restore_66689.py -q -vv \
            -k restore_keeps_current_old_api_policy_config
