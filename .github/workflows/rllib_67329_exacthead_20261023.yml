name: RLlib EnvRunner exact official PR 67329 red-green (CPU)
on:
  push:
    branches:
      - ci/rllib-67329-exacthead-20261023
  pull_request:
    branches:
      - fix/rllib-envrunner-monotonic-seq-current-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-version-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Ruff
        run: python -m pip install ruff==0.17.1
      - name: Compile official PR files and deterministic source fixture
        run: |
          python -m py_compile python/ray/rllib/env/multi_agent_env_runner.py python/ray/rllib/env/tests/test_multi_agent_env_runner.py ci/rllib_envrunner_monotonic_contract.py
          ruff check --isolated --select E4,E7,E9,F python/ray/rllib/env/multi_agent_env_runner.py python/ray/rllib/env/tests/test_multi_agent_env_runner.py
      - name: Positive control exact current PR implementation
        run: python ci/rllib_envrunner_monotonic_contract.py
      - name: Download unchanged official base for negative control
        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/ray-project/ray/7023d1114372bd213135daa86d06887bd62d0fdd/python/ray/rllib/env/multi_agent_env_runner.py -o original_multi_agent_env_runner.py
      - name: Expected baseline failure scenario with unchanged method
        run: python ci/rllib_envrunner_monotonic_contract.py original_multi_agent_env_runner.py --baseline
