name: RLlib self-play real Ray actor RPC proof (CPU)
on:
  pull_request:
    paths:
      - "ci/rllib_real_actor_activation.py"
      - ".github/workflows/rllib_real_actor_activation.yml"
      - "python/ray/rllib/examples/multi_agent/utils/self_play_league_based_callback.py"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ray-actor-rpc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU Ray binary extension and RLlib
        run: python -m pip install "ray[rllib]==2.59.0" pytest
      - name: Copy candidate callback into native Ray wheel
        run: |
          python - <<'PY'
          import pathlib, shutil, ray
          source = pathlib.Path("python/ray/rllib/examples/multi_agent/utils/self_play_league_based_callback.py")
          target = pathlib.Path(ray.__file__).parent / "rllib/examples/multi_agent/utils/self_play_league_based_callback.py"
          shutil.copy2(source,target)
          print("real Ray native",ray.__version__,ray._raylet.__file__)
          PY
      - name: Fetch unchanged previous PR callback for negative control
        run: |
          curl -fsSL https://raw.githubusercontent.com/ray-project/ray/4444ffcd555d2cc211f7b6e3bfb13a9d16fea918/python/ray/rllib/examples/multi_agent/utils/self_play_league_based_callback.py -o /tmp/old_selfplay_callback.py
      - name: Compile real-actor regression
        run: python -m py_compile ci/rllib_real_actor_activation.py
      - name: Candidate callback with actual local Ray cluster and actors
        run: python ci/rllib_real_actor_activation.py
      - name: Official old callback under identical actor health schedule
        run: python ci/rllib_real_actor_activation.py /tmp/old_selfplay_callback.py --baseline
