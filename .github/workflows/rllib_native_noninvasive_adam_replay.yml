name: RLlib noninvasive Adam checkpoint continuation diagnostic
on:
  push:
    branches:
      - research/rllib-state-commit-failstop-20261024
  pull_request:
    branches:
      - review/rllib-three-component-causal-state-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-ddp-noninvasive:
    runs-on: ubuntu-latest
    timeout-minutes: 23
    env:
      RAY_AUTH_MODE: disabled
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Native Ray + torch CPU
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install "ray[rllib]==2.59.0"
      - name: Install source CartPole native fixture
        run: |
          python - <<'PY'
          import pathlib,shutil,ray
          source=pathlib.Path("python/ray/rllib/offline/tests/data/cartpole/large.json")
          target=pathlib.Path(ray.__file__).resolve().parent/"rllib/offline/tests/data/cartpole/large.json"
          assert source.is_file() and source.stat().st_size>1000
          target.parent.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(source,target)
          PY
      - name: Native two Learner actor kill and unmodified Adam step replay
        run: |
          python -m py_compile ci/rllib_native_noninvasive_adam_replay.py ci/rllib_native_two_learner_ddp_crash_health.py
          cp ci/rllib_native_two_learner_ddp_crash_health.py /tmp/
          cp ci/rllib_native_noninvasive_adam_replay.py /tmp/
          cd /tmp
          timeout 900s python -u rllib_native_noninvasive_adam_replay.py
