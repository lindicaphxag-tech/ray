name: RLlib native recovery test against pinned method (CPU)
on:
  pull_request:
    paths:
      - "python/ray/rllib/algorithms/tests/test_algorithm.py"
      - "ci/rllib_native_restore_method_pytest.py"
      - ".github/workflows/rllib_native_restore_method_pytest.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compiled Ray RLlib wheel and pytest
        run: python -m pip install "ray[rllib]==2.59.0" pytest
      - name: Compile native test and runner
        run: |
          python -m py_compile python/ray/rllib/algorithms/tests/test_algorithm.py ci/rllib_native_restore_method_pytest.py
      - name: Candidate source with actual native Ray pytest
        run: python ci/rllib_native_restore_method_pytest.py
      - name: Download exact pre-fix official Algorithm method
        run: |
          curl -fsSL https://raw.githubusercontent.com/ray-project/ray/7795d644673b4a4ed4d407fd9e7b0ca981e9606b/python/ray/rllib/algorithms/algorithm.py -o /tmp/original_algorithm.py
      - name: Native negative control from unchanged official Algorithm
        run: python ci/rllib_native_restore_method_pytest.py --algorithm-file /tmp/original_algorithm.py --baseline
