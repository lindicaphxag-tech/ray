name: RLlib native Learner state integration smoke (CPU)
on:
  push:
    branches:
      - research/rllib-stale-optimizer-transaction-20261023
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-learner:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ray RLlib runtime, native test and torch CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
          python -m pip install "ray[rllib]==2.59.0" pytest
      - name: Check wheel import without overriding unrelated Ray source modules
        run: |
          python - <<'PY'
          import ray
          from pathlib import Path
          print("Ray wheel path:", ray.__file__)
          assert "/site-packages/" in ray.__file__
          assert Path("python/ray/rllib/core/learner/learner.py").is_file()
          PY
      - name: Execute real RLlib Learner with exact fork method AST
        env:
          RAY_DISABLE_DOCKER_CPU_WARNING: "1"
          RAY_DEDUP_LOGS: "0"
          PYTHONPATH: "/tmp"
        run: |
          cp ci/rllib_native_wheel_learner_smoke.py /tmp/
          cp python/ray/rllib/core/learner/learner.py /tmp/candidate_learner.py
          cd /tmp
          python rllib_native_wheel_learner_smoke.py /tmp/candidate_learner.py
